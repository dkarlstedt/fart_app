<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0d0d0d"/>
  <title>Fart</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="app">
    <svg id="butthole" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="flesh-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#1A0504"/>
          <stop offset="22%"  stop-color="#4D1A10"/>
          <stop offset="55%"  stop-color="#6B2516"/>
          <stop offset="100%" stop-color="#8B3A28"/>
        </radialGradient>
        <radialGradient id="ridge-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#3D1008"/>
          <stop offset="22%"  stop-color="#7A3020"/>
          <stop offset="55%"  stop-color="#9B4535"/>
          <stop offset="100%" stop-color="#BE6050"/>
        </radialGradient>
        <radialGradient id="opening-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#010101"/>
          <stop offset="55%"  stop-color="#1A0504"/>
          <stop offset="100%" stop-color="#4D1A10"/>
        </radialGradient>
        <filter id="outer-shadow" x="-25%" y="-25%" width="150%" height="150%">
          <feDropShadow dx="0" dy="5" stdDeviation="20" flood-color="#000" flood-opacity="0.95"/>
        </filter>
      </defs>

      <g filter="url(#outer-shadow)">
        <circle id="base-disc" cx="200" cy="200" r="150" fill="url(#flesh-grad)"/>

        <g id="ridges">
          <path class="segment" data-index="0"  fill="url(#ridge-grad)"/>
          <path class="segment" data-index="1"  fill="url(#ridge-grad)"/>
          <path class="segment" data-index="2"  fill="url(#ridge-grad)"/>
          <path class="segment" data-index="3"  fill="url(#ridge-grad)"/>
          <path class="segment" data-index="4"  fill="url(#ridge-grad)"/>
          <path class="segment" data-index="5"  fill="url(#ridge-grad)"/>
          <path class="segment" data-index="6"  fill="url(#ridge-grad)"/>
          <path class="segment" data-index="7"  fill="url(#ridge-grad)"/>
          <path class="segment" data-index="8"  fill="url(#ridge-grad)"/>
          <path class="segment" data-index="9"  fill="url(#ridge-grad)"/>
          <path class="segment" data-index="10" fill="url(#ridge-grad)"/>
          <path class="segment" data-index="11" fill="url(#ridge-grad)"/>
        </g>

        <g id="creases">
          <path class="crease" data-index="0"/>
          <path class="crease" data-index="1"/>
          <path class="crease" data-index="2"/>
          <path class="crease" data-index="3"/>
          <path class="crease" data-index="4"/>
          <path class="crease" data-index="5"/>
          <path class="crease" data-index="6"/>
          <path class="crease" data-index="7"/>
          <path class="crease" data-index="8"/>
          <path class="crease" data-index="9"/>
          <path class="crease" data-index="10"/>
          <path class="crease" data-index="11"/>
        </g>

        <circle id="center-opening" cx="200" cy="200" r="16" fill="url(#opening-grad)"/>
        <circle id="inner-ring"     cx="200" cy="200" r="16" fill="none" stroke="#1A0504" stroke-width="2"/>
      </g>

      <g id="drag-handles">
        <circle class="handle" data-index="0"  r="22" fill="transparent"/>
        <circle class="handle" data-index="1"  r="22" fill="transparent"/>
        <circle class="handle" data-index="2"  r="22" fill="transparent"/>
        <circle class="handle" data-index="3"  r="22" fill="transparent"/>
        <circle class="handle" data-index="4"  r="22" fill="transparent"/>
        <circle class="handle" data-index="5"  r="22" fill="transparent"/>
        <circle class="handle" data-index="6"  r="22" fill="transparent"/>
        <circle class="handle" data-index="7"  r="22" fill="transparent"/>
        <circle class="handle" data-index="8"  r="22" fill="transparent"/>
        <circle class="handle" data-index="9"  r="22" fill="transparent"/>
        <circle class="handle" data-index="10" r="22" fill="transparent"/>
        <circle class="handle" data-index="11" r="22" fill="transparent"/>
      </g>
    </svg>

    <button id="play-btn" aria-label="Play fart">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <polygon points="6,3 20,12 6,21" fill="#c0392b"/>
      </svg>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
