<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0d0d0d"/>
  <title>Fart</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="app">
    <svg id="butthole" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="flesh-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#2D0A06"/>
          <stop offset="38%" stop-color="#7A3020"/>
          <stop offset="100%" stop-color="#A06050"/>
        </radialGradient>
        <radialGradient id="center-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1A0504"/>
          <stop offset="100%" stop-color="#5C1E12"/>
        </radialGradient>
        <filter id="butthole-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="3" stdDeviation="14" flood-color="#000" flood-opacity="0.85"/>
        </filter>
      </defs>

      <g id="petals-group" filter="url(#butthole-shadow)">
        <path class="petal" data-index="0" fill="url(#flesh-grad)" stroke="#5C1E12" stroke-width="0.5"/>
        <path class="petal" data-index="1" fill="url(#flesh-grad)" stroke="#5C1E12" stroke-width="0.5"/>
        <path class="petal" data-index="2" fill="url(#flesh-grad)" stroke="#5C1E12" stroke-width="0.5"/>
        <path class="petal" data-index="3" fill="url(#flesh-grad)" stroke="#5C1E12" stroke-width="0.5"/>
        <path class="petal" data-index="4" fill="url(#flesh-grad)" stroke="#5C1E12" stroke-width="0.5"/>
        <path class="petal" data-index="5" fill="url(#flesh-grad)" stroke="#5C1E12" stroke-width="0.5"/>
        <path class="petal" data-index="6" fill="url(#flesh-grad)" stroke="#5C1E12" stroke-width="0.5"/>
        <path class="petal" data-index="7" fill="url(#flesh-grad)" stroke="#5C1E12" stroke-width="0.5"/>
      </g>

      <g id="wrinkles" stroke="#5C1E12" stroke-width="0.9" opacity="0.45" stroke-linecap="round">
        <line class="wrinkle" data-index="0"/>
        <line class="wrinkle" data-index="1"/>
        <line class="wrinkle" data-index="2"/>
        <line class="wrinkle" data-index="3"/>
        <line class="wrinkle" data-index="4"/>
        <line class="wrinkle" data-index="5"/>
        <line class="wrinkle" data-index="6"/>
        <line class="wrinkle" data-index="7"/>
      </g>

      <circle id="pucker-ring" cx="200" cy="200" r="13" fill="url(#center-grad)" stroke="#3D0E08" stroke-width="1.5"/>
      <circle id="center-dot" cx="200" cy="200" r="4.5" fill="#0F0302"/>

      <g id="drag-handles">
        <circle class="handle" data-index="0" r="22" fill="transparent"/>
        <circle class="handle" data-index="1" r="22" fill="transparent"/>
        <circle class="handle" data-index="2" r="22" fill="transparent"/>
        <circle class="handle" data-index="3" r="22" fill="transparent"/>
        <circle class="handle" data-index="4" r="22" fill="transparent"/>
        <circle class="handle" data-index="5" r="22" fill="transparent"/>
        <circle class="handle" data-index="6" r="22" fill="transparent"/>
        <circle class="handle" data-index="7" r="22" fill="transparent"/>
      </g>
    </svg>

    <button id="play-btn" aria-label="Play fart">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <polygon points="6,3 20,12 6,21" fill="#c0392b"/>
      </svg>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
